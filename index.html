<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vedette Experience</title>
    <style>
        body { background-color: #020617; color: #ffffff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 360px; background-color: #0f172a; padding: 20px; border-radius: 20px; border: 1px solid #1e293b; }
        h1 { text-align: center; color: #10b981; font-size: 22px; }
        .media-box { width: 100%; height: 200px; background-color: #020617; border: 2px dashed #334155; border-radius: 15px; margin-bottom: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        img, video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none !important; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-cam { background-color: #334155; color: white; }
        .btn-action { background: linear-gradient(to right, #10b981, #2563eb); color: white; margin-top: 10px; }
        .status { text-align: center; color: #34d399; margin-top: 15px; font-weight: bold; word-break: break-all; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI VEDETTE EXPERIENCE</h1>
        
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size:11px; color:#94a3b8; margin-bottom:5px;">Nombre y Apellido</label>
            <input type="text" id="insNombre" placeholder="Juan Pérez" style="width: 100%; padding: 10px; background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; box-sizing: border-box;">
        </div>

        <div class="media-box">
            <img id="capturedImage" class="hidden" alt="Vista previa">
            <video id="camVideo" class="hidden" playsinline autoplay muted></video>
            <div id="placeholderText" style="color: #64748b;">Sin foto seleccionada</div>
        </div>

        <button type="button" id="startCamBtn" class="btn-cam">Usar Cámara</button>
        <button type="button" id="captureBtn" class="btn-cam hidden">Capturar Foto</button>

        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size:11px; color:#94a3b8; margin-bottom:5px;">O subir un archivo:</label>
            <input type="file" id="fileInput" accept="image/*" style="color: white;">
        </div>

        <button type="button" id="submitBtn" class="btn-action">TRANSFORMARME EN VEDETTE</button>

        <div id="statusZone" class="status hidden">Conectando...</div>
        <div id="videoContainer" class="hidden" style="margin-top:15px;"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const capturedImage = document.getElementById('capturedImage');
        const placeholderText = document.getElementById('placeholderText');
        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const camVideo = document.getElementById('camVideo');
        const submitBtn = document.getElementById('submitBtn');
        const statusZone = document.getElementById('statusZone');
        const videoContainer = document.getElementById('videoContainer');

        let base64Photo = null;
        let stream = null;

const DIRECT_FAL_KEY = "fca08466-a4e0-4ca9-bcc0-d203a0c0a09b:ae04548ab0e6eacca8056535071dff8a";


        fileInput.addEventListener('change', function(event) {
            const file = event.target.files;
            if (file && file[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Photo = e.target.result;
                    capturedImage.src = base64Photo;
                    capturedImage.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    apagarCamara();
                };
                reader.readAsDataURL(file[0]);
            }
        });

        startCamBtn.addEventListener('click', async function() {
            if (stream) { apagarCamara(); return; }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                camVideo.srcObject = stream;
                camVideo.classList.remove('hidden');
                capturedImage.classList.add('hidden');
                placeholderText.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                startCamBtn.textContent = 'Apagar Cámara';
            } catch (err) {
                alert('Error al acceder a la cámara. Asegúrate de dar permisos HTTPS.');
            }
        });

        captureBtn.addEventListener('click', function() {
            if (!stream) return;
            const canvas = document.createElement('canvas');
            canvas.width = camVideo.videoWidth || 640;
            canvas.height = camVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(camVideo, 0, 0, canvas.width, canvas.height);
            base64Photo = canvas.toDataURL('image/jpeg', 0.8);
            capturedImage.src = base64Photo;
            capturedImage.classList.remove('hidden');
            apagarCamara();
        });

        function apagarCamara() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            camVideo.srcObject = null;
            camVideo.classList.add('hidden');
            captureBtn.classList.add('hidden');
            startCamBtn.textContent = 'Usar Cámara';
        }

        submitBtn.addEventListener('click', async function() {
            const nombre = document.getElementById('insNombre').value.trim();
            if (!nombre) { alert("Ingresa tu Nombre."); return; }
            if (!base64Photo) { alert("Sácate una foto o selecciona un archivo."); return; }

            statusZone.classList.remove('hidden');
            statusZone.style.color = "#34d399";
            statusZone.textContent = "Conectando con la IA de Kling...";
            videoContainer.innerHTML = "";

            try {
                // LLAMADA DIRECTA POR PASARELA HTTPS DESDE TU DOMINIO SEGURO A FAL
                const response = await fetch("https://fal.run", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Key ${DIRECT_FAL_KEY}`
                    },
                    body: JSON.stringify({
                        image_url: base64Photo,
                        prompt: "Cinematic performance video. The person in the image is transformed into a spectacular vedette dancer, wearing an exquisite professional carnival costume with massive colorful feathers and sparkling sequins. Performing an energetic and glamorous choreography on a theater stage with dramatic cinematic lighting, 4k, realistic movement.",
                        duration: "5"
                    })
                });

                if (!response.ok) {
                    const txt = await response.text().catch(() => "Sin respuesta");
                    throw new Error(`FAL rechazó: ${response.status} - ${txt}`);
                }

                const data = await response.json();
                const requestId = data.request_id;

                statusZone.textContent = "Cocinando tu video de Vedette (esperando en cola)...";

                let videoUrl = null;
                while (!videoUrl) {
                    await new Promise(r => setTimeout(r, 4000));
                    const checkRes = await fetch(`https://fal.run/requests/${requestId}`, {
                        headers: { "Authorization": `Key ${DIRECT_FAL_KEY}` }
                    });
                    const checkData = await checkRes.json();
                    
                    if (checkData.status === "COMPLETED") {
                        videoUrl = checkData.video?.url || checkData.video_url;
                        break;
                    } else if (checkData.status === "FAILED") {
                        throw new Error("La generación de Kling falló internamente.");
                    }
                }

                statusZone.textContent = "¡Video generado con éxito!";
                videoContainer.classList.remove('hidden');
                videoContainer.innerHTML = `<video src="${videoUrl}" controls autoplay loop style="width:100%; border-radius:10px;"></video>`;

            } catch (err) {
                statusZone.style.color = "#ef4444";
                statusZone.textContent = `FALLÓ EL PROCESO: ${err.message}`;
            }
        });
    </script>
</body>
</html>
