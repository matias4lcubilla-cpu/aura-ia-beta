<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA AI 2.0</title>
    <style>
        body {
            background-color: #020617;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 24px;
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            margin: 0 0 4px 0;
            color: #10b981;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 10px;
            font-weight: bold;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        input[type="text"], input[type="tel"], input[type="email"] {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .media-box {
            width: 100%;
            height: 220px;
            background-color: #020617;
            border: 2px dashed #334155;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
        }
        img, video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hidden {
            display: none !important;
        }
        button, a.btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            transition: 0.2s;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }
        .btn-action {
            background: linear-gradient(to right, #10b981, #2563eb);
            color: white;
            margin-top: 16px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .alert-box {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 11px;
            color: #34d399;
            margin-bottom: 16px;
        }
        .zone-status {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-top: 16px;
        }
        .input-file-classic {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            color: #cbd5e1;
            font-size: 12px;
            box-sizing: border-box;
            cursor: pointer;
        }
        .camera-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .camera-controls button {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
        }
        #mediaOutput video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: black;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AURA AI 2.0</h1>
        <div class="subtitle">Baila junto a nuestro bailarín con el poder de la IA</div>

        <div class="input-group">
            <label>Nombre y Apellido</label>
            <input type="text" id="insNombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="input-group">
            <label>Teléfono</label>
            <input type="tel" id="insTel" placeholder="Ej: +54 9 11...">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="insEmail" placeholder="Ej: correo@gmail.com">
        </div>

        <div class="alert-box">
            💡 <b>Recomendación:</b> Selecciona una foto mostrando de la cintura para arriba.
        </div>

        <div class="media-box">
            <img id="capturedImage" class="hidden" alt="Vista previa">
            <video id="camVideo" class="hidden" playsinline autoplay muted></video>
            <div id="placeholderText">
                <div style="text-align: center;">
                    <div style="font-size: 32px;">📷</div>
                    <div style="color: #94a3b8; font-size: 12px; margin-top: 8px;">Ninguna foto seleccionada</div>
                </div>
            </div>
        </div>

        <div class="camera-controls">
            <button type="button" id="startCamBtn">Usar cámara</button>
            <button type="button" id="captureBtn" class="hidden">Capturar</button>
        </div>

        <div class="input-group">
            <label style="color: #cbd5e1;">Seleccionar foto del dispositivo:</label>
            <input type="file" id="fileInput" accept="image/*" class="input-file-classic">
        </div>

        <button type="button" id="submitBtn" class="btn-action">GENERAR VIDEO JUNTOS</button>

        <div id="resultZone" class="zone-status hidden">
            <div id="loadingStatus">
                <div style="color: #34d399; font-size: 14px; font-weight: bold; margin-bottom: 4px;" id="statusMessage">Conectando con la IA...</div>
                <div style="color: #64748b; font-size: 11px;">Por favor, espera unos 60 segundos sin cerrar la pestaña.</div>
            </div>
            
            <div id="outputContainer" class="hidden">
                <div style="color: #10b981; font-size: 14px; font-weight: bold; margin-bottom: 12px;">✨ ¡Video Creado con Éxito!</div>
                <div id="mediaOutput" style="width: 100%; border-radius: 8px; overflow: hidden; background-color: black;"></div>
                <button type="button" id="downloadBtn" class="hidden" style="background-color: #1e293b; color: white; margin-top: 12px; width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold">DESCARGAR VIDEO</button>
            </div>
        </div>
    </div>

    <script>
        // Element references
        const fileInput = document.getElementById('fileInput');
        const capturedImage = document.getElementById('capturedImage');
        const placeholderText = document.getElementById('placeholderText');
        const submitBtn = document.getElementById('submitBtn');
        const resultZone = document.getElementById('resultZone');
        const loadingStatus = document.getElementById('loadingStatus');
        const statusMessage = document.getElementById('statusMessage');
        const outputContainer = document.getElementById('outputContainer');
        const mediaOutput = document.getElementById('mediaOutput');
        const downloadBtn = document.getElementById('downloadBtn');

        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const camVideo = document.getElementById('camVideo');

        // Global state
        let base64Photo = null;      // For preview
        let selectedBlob = null;     // Raw binary to upload
        let stream = null;
        let isProcessing = false;

        // Fal.ai key (as provided)
        const LLAVE_INTERNA_FAL = "5da8dc23-d13a-410a-aebd-41c459c50064:5abfa1b853971d383a15d6113c2208cc";

        // Utility: stop camera
        function stopCameraIfOn() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
        }

        // Start/stop camera
        startCamBtn.addEventListener('click', async () => {
            if (stream) {
                stopCameraIfOn();
                camVideo.classList.add('hidden');
                placeholderText.classList.remove('hidden');
                captureBtn.classList.add('hidden');
                startCamBtn.textContent = "Usar cámara";
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                camVideo.srcObject = stream;
                camVideo.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                capturedImage.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                startCamBtn.textContent = "Apagar cámara";
            } catch (err) {
                alert("La cámara requiere permisos del dispositivo o entorno HTTPS seguro.");
            }
        });

        // Capture photo from camera: save both base64 (preview) and Blob (upload)
        captureBtn.addEventListener('click', async () => {
            if (!camVideo || !stream) return;
            const canvas = document.createElement('canvas');
            canvas.width = camVideo.videoWidth || 640;
            canvas.height = camVideo.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(camVideo, 0, 0, canvas.width, canvas.height);

            base64Photo = canvas.toDataURL('image/jpeg', 0.85);
            capturedImage.src = base64Photo;
            capturedImage.classList.remove('hidden');
            camVideo.classList.add('hidden');
            placeholderText.classList.add('hidden');

            // Convert base64 to Blob and store in selectedBlob for upload
            try {
                const blob = await (await fetch(base64Photo)).blob();
                selectedBlob = new Blob([blob], { type: 'image/jpeg' });
            } catch (err) {
                console.error('Error convirtiendo base64 a Blob:', err);
                selectedBlob = null;
            }
            // Stop camera automatically after capture to avoid resource usage
            stopCameraIfOn();
            captureBtn.classList.add('hidden');
            startCamBtn.textContent = "Usar cámara";
        });

        // File input: store Blob (binary) and Base64 for preview
        fileInput.addEventListener('change', async (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            selectedBlob = f; // keep raw blob for upload
            // Create preview base64
            const reader = new FileReader();
            reader.onload = () => {
                base64Photo = reader.result;
                capturedImage.src = base64Photo;
                capturedImage.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                camVideo.classList.add('hidden');
                captureBtn.classList.add('hidden');
                stopCameraIfOn();
                startCamBtn.textContent = "Usar cámara";
            };
            reader.onerror = (err) => {
                console.error('Error leyendo archivo para preview', err);
            };
            reader.readAsDataURL(f);
        });

        // Helper: sleep
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Upload binary to Fal.ai storage endpoint
        async function uploadFileToFal(blob) {
            const form = new FormData();
            // Use a sensible filename
            form.append('file', blob, 'photo.jpg');

            const res = await fetch('https://fal.run', {
                method: 'POST',
                headers: {
                    'Authorization': 'Key ' + LLAVE_INTERNA_FAL
                    // NOTE: Do NOT set Content-Type for FormData; browser will set multipart boundary
                },
                body: form
            });

            if (!res.ok) {
                const text = await res.text().catch(() => '');
                throw new Error(`Upload failed (${res.status}): ${text}`);
            }
            const json = await res.json().catch(() => ({}));
            // Try multiple common key names
            const fileUrl = json.file_url || json.fileUrl || json.url || json.data?.file_url || json.data?.url;
            if (!fileUrl) throw new Error('No file_url returned by upload endpoint.');
            return fileUrl;
        }

        // Initiate processing (Kling) sending image_url and prompt
        async function startProcessingWithFal(file_url, extra = {}) {
            const payload = {
                image_url: file_url,
                prompt: extra.prompt || "Baila junto a nuestro bailarín con movimientos naturales y sincronizados. Mantén fondo limpio y realiza animación de cuerpo completo."
            };
            const res = await fetch('https://fal.run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Key ' + LLAVE_INTERNA_FAL
                },
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const text = await res.text().catch(() => '');
                throw new Error(`Process start failed (${res.status}): ${text}`);
            }
            const json = await res.json().catch(() => ({}));
            // Expect status_url returned
            const statusUrl = json.status_url || json.statusUrl || json.job?.status_url || json.status_endpoint || json.status;
            if (!statusUrl) throw new Error('No status_url returned when starting processing.');
            return statusUrl;
        }

        // Poll status_url every 4s until COMPLETED
        async function pollUntilCompleted(statusUrl, onUpdate) {
            // Normalize URL: sometimes APIs return relative paths
            const absoluteStatusUrl = statusUrl.startsWith('http') ? statusUrl : ('https://fal.run' + (statusUrl.startsWith('/') ? '' : '/') + statusUrl);
            while (true) {
                const res = await fetch(absoluteStatusUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Key ' + LLAVE_INTERNA_FAL,
                        'Accept': 'application/json'
                    }
                });
                if (!res.ok) {
                    const text = await res.text().catch(() => '');
                    throw new Error(`Status check failed (${res.status}): ${text}`);
                }
                const json = await res.json().catch(() => ({}));
                const status = (json.status || json.state || json.job?.status || json.data?.status || '').toString().toUpperCase();
                // Update UI
                if (onUpdate) {
                    onUpdate(status, json);
                }
                if (status === 'COMPLETED' || status === 'SUCCEEDED' || status === 'DONE' ) {
                    return json;
                }
                if (status === 'FAILED' || status === 'ERROR') {
                    throw new Error('Processing failed on remote service.');
                }
                await sleep(4000);
            }
        }

        // Show result, embed video and enable download
        function showResultAndEnableDownload(videoUrl) {
            // Hide loading status, show output container
            loadingStatus.classList.add('hidden');
            outputContainer.classList.remove('hidden');
            resultZone.classList.remove('hidden');

            // Clear previous output
            mediaOutput.innerHTML = '';

            // Create video element
            const v = document.createElement('video');
            v.setAttribute('controls', '');
            v.setAttribute('autoplay', '');
            v.setAttribute('loop', '');
            v.setAttribute('playsinline', '');
            v.muted = false;
            v.src = videoUrl;
            v.style.display = 'block';
            mediaOutput.appendChild(v);

            // Enable download button
            downloadBtn.classList.remove('hidden');
            downloadBtn.onclick = () => {
                // Trigger download via anchor
                const a = document.createElement('a');
                a.href = videoUrl;
                // Suggest filename
                a.download = 'aura_ai_result.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
            };

            // Scroll result into view (for mobile)
            resultZone.scrollIntoView({ behavior: 'smooth' });
        }

        // Submit flow
        submitBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            isProcessing = true;
            // Reset UI
            outputContainer.classList.add('hidden');
            downloadBtn.classList.add('hidden');
            loadingStatus.classList.remove('hidden');
            resultZone.classList.remove('hidden');
            statusMessage.textContent = 'Preparando archivo...';

            try {
                if (!selectedBlob) {
                    throw new Error('No hay foto seleccionada. Usa la cámara o selecciona una imagen.');
                }

                // Stop camera if running to free resources
                stopCameraIfOn();

                // 1) Upload binary to Fal.ai temporary storage
                statusMessage.textContent = 'Subiendo imagen al almacenamiento seguro...';
                const fileUrl = await uploadFileToFal(selectedBlob);

                // 2) Start processing by sending image_url (Kling) to Fal.ai
                statusMessage.textContent = 'Enviando orden de procesamiento a la IA...';
                const statusUrl = await startProcessingWithFal(fileUrl);

                // 3) Poll status
                statusMessage.textContent = 'Encolado. Esperando procesamiento...';
                const finalJson = await pollUntilCompleted(statusUrl, (status, fullJson) => {
                    // Map status to a friendly message
                    if (status.includes('QUEUE') || status.includes('IN_QUEUE')) {
                        statusMessage.textContent = 'En cola (IN_QUEUE)...';
                    } else if (status.includes('PROGRESS') || status.includes('IN_PROGRESS') || status.includes('RUNNING')) {
                        statusMessage.textContent = 'Procesando (IN_PROGRESS)...';
                    } else if (status.includes('COMPLETED') || status.includes('SUCCEEDED') || status.includes('DONE')) {
                        statusMessage.textContent = 'Completado. Preparando resultado...';
                    } else {
                        statusMessage.textContent = `Estado: ${status}`;
                    }
                });

                // 4) Extract video URL from result
                // Try multiple possible fields where a provider might place the result
                let videoUrl = null;
                videoUrl = videoUrl || finalJson.result?.video?.url;
                videoUrl = videoUrl || finalJson.output?.video_url;
                videoUrl = videoUrl || finalJson.data?.result?.video?.url;
                videoUrl = videoUrl || finalJson.video?.url;
                videoUrl = videoUrl || finalJson.result_url || finalJson.output?.url || finalJson.url;

                if (!videoUrl) {
                    // Some APIs return a 'results' array
                    if (Array.isArray(finalJson.results) && finalJson.results.length) {
                        const candidate = finalJson.results.find(r => r.video && r.video.url) || finalJson.results[0];
                        videoUrl = candidate?.video?.url || candidate?.url || candidate?.output?.video_url;
                    }
                }

                if (!videoUrl) {
                    throw new Error('No se encontró la URL del video en la respuesta final.');
                }

                // 5) Render result and enable download
                showResultAndEnableDownload(videoUrl);

            } catch (err) {
                console.error(err);
                statusMessage.textContent = 'Error: ' + (err.message || 'Ocurrió un error durante el proceso.');
                alert('Error: ' + (err.message || 'Fallo inesperado. Revisa la consola para más detalles.'));
            } finally {
                isProcessing = false;
            }
        });

        // Ensure cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopCameraIfOn();
        });
    </script>
</body>
</html>
