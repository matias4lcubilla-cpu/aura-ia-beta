<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Dance Studio - Demo</title>
    <style>
        body { background-color: #020617; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .container { width: 100%; max-width: 380px; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 24px; padding: 24px; box-sizing: border-box; }
        h1 { text-align: center; font-size: 24px; margin: 0 0 4px 0; color: #10b981; }
        .subtitle { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 24px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        input[type="text"], input[type="tel"], input[type="email"] { width: 100%; background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: white; font-size: 14px; box-sizing: border-box; outline: none; }
        .media-box { width: 100%; height: 220px; background-color: #020617; border: 2px dashed #334155; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; margin-bottom: 16px; }
        img, video { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none !important; }
        button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
        .btn-action { background: linear-gradient(to right, #10b981, #2563eb); color: white; margin-top: 16px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .alert-box { background-color: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); padding: 12px; border-radius: 12px; text-align: center; font-size: 11px; color: #34d399; margin-bottom: 16px; }
        .zone-status { background-color: #020617; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; text-align: center; margin-top: 16px; }
        .input-file-classic { width: 100%; background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 10px; color: #cbd5e1; font-size: 12px; box-sizing: border-box; cursor: pointer; }
        .camera-controls { display: flex; gap: 8px; margin-bottom: 12px; }
        .camera-controls button { flex: 1; padding: 8px; border-radius: 10px; font-size: 13px; background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; word-break: break-all; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI DANCE EXPERIENCE</h1>
        <div class="subtitle">Baila junto a nuestro bailarín con el poder de la IA</div>

        <div class="input-group">
            <label>Nombre y Apellido</label>
            <input type="text" id="insNombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="input-group">
            <label>Teléfono</label>
            <input type="tel" id="insTel" placeholder="Ej: +54 9 11...">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="insEmail" placeholder="Ej: correo@gmail.com">
        </div>

        <div class="alert-box">
            💡 <b>Recomendación:</b> Selecciona una foto mostrando de la cintura para arriba.
        </div>

        <div class="media-box">
            <img id="capturedImage" class="hidden" alt="Vista previa">
            <video id="camVideo" class="hidden" playsinline autoplay muted></video>
            <div id="placeholderText">
                <div style="text-align: center;">
                    <div style="font-size: 32px;">📷</div>
                    <div style="color: #94a3b8; font-size: 12px; margin-top: 8px;">Ninguna foto seleccionada</div>
                </div>
            </div>
        </div>

        <div class="camera-controls">
            <button type="button" id="startCamBtn">Usar cámara</button>
            <button type="button" id="captureBtn" class="hidden">Capturar</button>
        </div>

        <div class="input-group">
            <label style="color: #cbd5e1;">Seleccionar foto del dispositivo:</label>
            <input type="file" id="fileInput" accept="image/*" class="input-file-classic">
        </div>

        <button type="button" id="submitBtn" class="btn-action">GENERAR VIDEO JUNTOS</button>

        <div id="statusZone" class="status-msg hidden">Iniciando proceso...</div>
        <div id="videoContainer" class="hidden" style="margin-top:15px; width: 100%;"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const capturedImage = document.getElementById('capturedImage');
        const placeholderText = document.getElementById('placeholderText');
        const submitBtn = document.getElementById('submitBtn');
        const startCamBtn = document.getElementById('startCamBtn');
        const captureBtn = document.getElementById('captureBtn');
        const camVideo = document.getElementById('camVideo');
        const statusZone = document.getElementById('statusZone');
        const videoContainer = document.getElementById('videoContainer');

        let base64Photo = null;
        let stream = null;

        // URL Vinculada y verificada de forma idéntica a tu Render
        const BACKEND_URL = "https://backend-kling.onrender.com";

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files && e.target.files[0];
            if (file) {
                const lector = new FileReader();
                lector.onload = function(evt) {
                    base64Photo = evt.target.result;
                    capturedImage.src = base64Photo;
                    capturedImage.classList.remove('hidden');
                    placeholderText.classList.add('hidden');
                    stopCameraIfOn();
                };
                lector.readAsDataURL(file);
            }
        });

        startCamBtn.addEventListener('click', async function() {
            try {
                if (stream) {
                    stopCameraIfOn();
                    return;
                }
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                camVideo.srcObject = stream;
                camVideo.classList.remove('hidden');
                capturedImage.classList.add('hidden');
                placeholderText.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                try { await camVideo.play(); } catch (err) { }
                startCamBtn.textContent = 'Detener cámara';
            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                alert('No se pudo acceder a la cámara. Verifica permisos.');
            }
        });

        captureBtn.addEventListener('click', function() {
            if (!stream) return;
            const w = camVideo.videoWidth || 640;
            const h = camVideo.videoHeight || 480;
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(camVideo, 0, 0, w, h);
            base64Photo = canvas.toDataURL('image/jpeg', 0.9);
            capturedImage.src = base64Photo;
            capturedImage.classList.remove('hidden');
            stopCameraIfOn();
        });

        function stopCameraIfOn() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            try { camVideo.srcObject = null; } catch (e) {}
            camVideo.classList.add('hidden');
            captureBtn.classList.add('hidden');
            startCamBtn.textContent = 'Usar cámara';
        }

        submitBtn.onclick = async function() {
            const nombre = document.getElementById('insNombre').value.trim();
            if (!nombre) { alert("Por favor, ingresa tu Nombre y Apellido."); return; }
            if (!base64Photo) { alert("Por favor, selecciona o sácate una foto primero."); return; }

            statusZone.classList.remove('hidden');
            statusZone.style.color = "#34d399";
            statusZone.textContent = "Conectando al servidor seguro... enviando foto (60s)";
            videoContainer.innerHTML = "";

            try {
                const resp = await fetch(`${BACKEND_URL}/api/generate-video`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userImageBase64: base64Photo })
                });

                if (!resp.ok) {
                    const errText = await resp.text().catch(() => "Sin detalles");
                    throw new Error(`Error en Render (Código ${resp.status}): ${errText}`);
                }

                const data = await resp.json();

                if (data.videoUrl) {
                    statusZone.textContent = "✨ ¡Video creado con éxito!";
                    videoContainer.classList.remove('hidden');
                    videoContainer.innerHTML = `<video controls autoplay loop src="${data.videoUrl}" style="width:100%; border-radius:12px; height:auto; background: black;"></video>`;
                } else {
                    throw new Error("El servidor procesó la petición pero no devolvió el archivo de video final.");
                }

            } catch (err) {
                console.error(err);
